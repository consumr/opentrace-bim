name: Import verified OpenTrace BIM v0.42.0
on:
  push:
    branches:
      - release/0.42.0-prep
    paths:
      - .github/workflows/import-opentrace-v042.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'lelopes05/opentrace-bim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.42.0-prep
          fetch-depth: 0
          persist-credentials: true
      - name: Download, validate, and import published v0.42.0 source
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/OpenTrace_BIM-v0.42.0.zip"
          EXTRACT="$RUNNER_TEMP/opentrace-v042"
          curl --fail --location --show-error --silent --retry 4 --retry-delay 3 \
            'https://github.com/lelopes05/opentrace-bim/releases/download/v0.42.0/OpenTrace_BIM-v0.42.0.zip' -o "$FILE"
          printf '%s  %s\n' 'cad7ea3b819f6add7f35c00046ab37d60e80b2bf93af680c87aa0ce60febae4c' "$FILE" | sha256sum --check
          mkdir -p "$EXTRACT"
          unzip -q "$FILE" -d "$EXTRACT"
          mapfile -t MATCHES < <(find "$EXTRACT" -type d -name OpenTrace_BIM)
          if [[ "${#MATCHES[@]}" -ne 1 ]]; then
            echo "Expected exactly one OpenTrace_BIM folder. Found: ${#MATCHES[@]}"
            exit 1
          fi
          SRC="${MATCHES[0]}"
          test -f "$SRC/__init__.py"
          grep -Eq '0\.42\.0' "$SRC/__init__.py"
          N=$(find "$SRC" -type f -name '*.py' | wc -l)
          if (( N < 50 )); then
            echo "Refusing unexpectedly small source tree ($N Python files)"
            exit 1
          fi
          mkdir -p OpenTrace_BIM
          rsync -a --delete "$SRC/" OpenTrace_BIM/
          git add -A OpenTrace_BIM
          if git diff --cached --quiet; then
            echo 'Source is already identical; nothing to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import verified OpenTrace BIM v0.42.0 source from official release ZIP'
          git push origin HEAD:refs/heads/release/0.42.0-prep
          echo "Imported source at $(git rev-parse HEAD)"
