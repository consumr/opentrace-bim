name: Validate OpenTrace v0.42.2 updater
on:
  push:
    branches:
      - fix/updater-wired-v0.42.2
    paths:
      - .github/workflows/qa-updater-v0422.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'lelopes05/opentrace-bim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/updater-wired-v0.42.2
      - name: Check update logic and compile all plugin Python modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_updater_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          root = Path('OpenTrace_BIM')
          files = sorted(root.rglob('*.py'))
          assert len(files) >= 80, len(files)
          for f in files:
              compile(f.read_bytes(), str(f), 'exec')
          assert '__version__ = "0.42.2"' in (root / '__init__.py').read_text()
          print('Compiled', len(files), 'Python modules')
          PY
          mkdir -p docs/releases/v0.42.2
          printf '# v0.42.2 — automated validation\n\nOffline updater feed and Home button wiring tests passed; all plugin Python modules compiled. Runtime GUI mouse test remains pending.\n' > docs/releases/v0.42.2/QA_RESULT.md
          git add docs/releases/v0.42.2/QA_RESULT.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record successful v0.42.2 updater and Home wiring QA'
          git push origin HEAD:refs/heads/fix/updater-wired-v0.42.2
